# Spotify 仅去广告 · Quantumult X 排查用模块
# 只清广告，不碰 nebula 产品状态。用来判断"跳歌"到底是哪一层引起的。
#
# 排查步骤：
#   1. 只启用本模块（把 spotify.conf 停用），重启 Spotify
#      → 能正常播放 = 问题在 nebula 属性补丁
#      → 还在跳歌   = 问题在去广告脚本或 App 本身
#   2. 两个模块都停用再试一次
#      → 还跳歌 = 跟脚本无关（App/账号状态）
#
# 确认后回到主模块 spotify.conf

hostname = spclient.wg.spotify.com, *spclient.spotify.com

^https:\/\/(spclient\.wg\.spotify\.com|[a-z0-9-]+-spclient\.spotify\.com)(:443)?\/(ads\/v3\/ads|ad-logic\/prefetch) url script-response-body https://raw.githubusercontent.com/dhicoc/qx-ipquality/master/spotify/spotify-ads.js
