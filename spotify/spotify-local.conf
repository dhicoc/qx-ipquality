# Spotify Premium 解锁 · Quantumult X 重写模块
# 适配: Spotify iOS 9.x（9.2.0.2054 实测）
# 仓库: https://github.com/dhicoc/qx-ipquality
#
# 9.x 已废弃 bootstrap/v1/bootstrap 与 user-customization-service/v1/customize，
# 产品状态改由 GET /nebula/v1/configuration/attributes 下发，本模块针对新接口。
#
# 导入: 脚本放「我的 iPhone → Quantumult X → Scripts」，本文件作为重写模块导入
# 并确保 MitM 主机名含 spclient.wg.spotify.com 与 *spclient.spotify.com，证书已信任

hostname = spclient.wg.spotify.com, *spclient.spotify.com

# 1. 删 If-None-Match 强制 200（否则 304 命中本地缓存的 free 状态，脚本不执行）
^https:\/\/(spclient\.wg\.spotify\.com|[a-z0-9-]+-spclient\.spotify\.com)(:443)?\/nebula\/v1\/configuration\/attributes url script-request-header spotify-nebula-header.js

# 2. 产品状态 free → premium（protobuf / JSON 双支持）
^https:\/\/(spclient\.wg\.spotify\.com|[a-z0-9-]+-spclient\.spotify\.com)(:443)?\/nebula\/v1\/configuration\/attributes url script-response-body spotify-nebula.js

# 3. 可选：伪装设备 license 解锁高音质。默认关闭，确认主脚本生效后再开，播放异常就关掉
#^https:\/\/(spclient\.wg\.spotify\.com|[a-z0-9-]+-spclient\.spotify\.com)(:443)?\/device-capabilities\/v1\/capabilities url script-response-body spotify-capabilities.js

# ===== Spotify 8.x 及更早（旧接口，9.x 不会触发；用不到可整段删）=====
#^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize$ url script-request-header https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-qx-header.js
#^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$ url script-response-body https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-proto.js
#^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/ url script-request-header https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-json.js
