# 海角解锁 · Quantumult X 配置（远程脚本版 · 直填可用）
# 脚本指向本仓库 raw，域名已按 haijiao.com 填好，整段粘进配置即可

[rewrite_local]

# 1) 核心：取址改写。POST /api/attachment 的 resource_id → 免费通行证帖
^https?:\/\/haijiao\.com\/api\/attachment url script-request-body https://raw.githubusercontent.com/dhicoc/qx-ipquality/master/haijiao/qx/hj-pass.js

# 2) 广告接口置空（banner / ad / advert）
^https?:\/\/haijiao\.com\/api\/(?:banner|ad|advert)\/ url script-response-body https://raw.githubusercontent.com/dhicoc/qx-ipquality/master/haijiao/qx/hj-banner.js

# 3) banner 图片换 1x1 透明 GIF
^https?:\/\/haijiao\.com\/.*\/hjstore\/system\/banner\/[^\/?#]+\.(?:gif|jpe?g|png|webp|bmp)\.txt url reject-img

# 4) 页面注入：摘除 30 秒试看门禁 + 隐藏广告位
^https?:\/\/haijiao\.com\/(?!api\/)(?!.*\.(?:js|css|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf|mp4|m3u8|ts|json)(?:\?|$)).*$ url script-response-body https://raw.githubusercontent.com/dhicoc/qx-ipquality/master/haijiao/qx/hj-html.js

[mitm]
hostname = %APPEND% haijiao.com
