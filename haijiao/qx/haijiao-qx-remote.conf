# 海角解锁 · Quantumult X 配置（远程脚本版，直接用这个改域名就行）
# 把 hj.example.com 全部替换成你实际访问的域名

[rewrite_local]

^https?:\/\/hj\.example\.com\/api\/attachment url script-request-body https://raw.githubusercontent.com/dhicoc/qx-ipquality/master/haijiao/qx/hj-pass.js

^https?:\/\/hj\.example\.com\/api\/(?:banner|ad|advert)\/ url script-response-body https://raw.githubusercontent.com/dhicoc/qx-ipquality/master/haijiao/qx/hj-banner.js

^https?:\/\/hj\.example\.com\/.*\/hjstore\/system\/banner\/[^\/?#]+\.(?:gif|jpe?g|png|webp|bmp)\.txt url reject-img

^https?:\/\/hj\.example\.com\/(?!api\/)(?!.*\.(?:js|css|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf|mp4|m3u8|ts|json)(?:\?|$)).*$ url script-response-body https://raw.githubusercontent.com/dhicoc/qx-ipquality/master/haijiao/qx/hj-html.js

[mitm]
hostname = %APPEND% hj.example.com
