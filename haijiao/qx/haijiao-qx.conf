# 海角解锁 · Quantumult X 配置片段
# 用法：整段粘进你自己的 .conf，或 QX → 配置文件 → 编辑，插到对应段落里
# 把 hj.example.com 全部替换成你实际访问的域名（含 www 就写 www）

[rewrite_local]

# 1) 核心：取址改写。POST /api/attachment 的 resource_id → 免费通行证帖
^https?:\/\/hj\.example\.com\/api\/attachment url script-request-body hj-pass.js

# 2) 广告接口置空（banner / ad / advert）
^https?:\/\/hj\.example\.com\/api\/(?:banner|ad|advert)\/ url script-response-body hj-banner.js

# 3) banner 图片换 1x1 透明 GIF
^https?:\/\/hj\.example\.com\/.*\/hjstore\/system\/banner\/[^\/?#]+\.(?:gif|jpe?g|png|webp|bmp)\.txt url reject-img

# 4) 页面注入：摘除 30 秒试看门禁 + 隐藏广告位
#    排除 api 和静态资源，只有真正的 HTML 页面才进脚本（脚本内还会再验一次 Content-Type）
^https?:\/\/hj\.example\.com\/(?!api\/)(?!.*\.(?:js|css|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf|mp4|m3u8|ts|json)(?:\?|$)).*$ url script-response-body hj-html.js

[mitm]
hostname = %APPEND% hj.example.com

# ---------------------------------------------------------------
# 只想要「完整视频」、不想折腾注入？只留第 1 条也能跑，
# 但 30 秒 pause + 购买弹窗是前端 DPlayer 逻辑，QX 改不了流量，
# 必须靠第 4 条注入的脚本去摘，缺了它视频照样在 30 秒断。
# ---------------------------------------------------------------
